[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
gl = "0.14.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
image = "0.25.10"
nalgebra-glm = "0.21.0"
winit = "0.30.13"
macros = { path = "./macros" }
msdfgen = "0.2.1"
ttf-parser = "0.18.1"
arc-swap = "1.9.2"
bitvec = "1.1.1"

[workspace]
members = ["macros"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
